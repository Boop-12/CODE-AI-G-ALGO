name: GNK Algo CI
on:
  push:
    branches: [main, "merger/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: gnkalgo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gnkalgo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci_test_password@localhost:5432/gnkalgo_test
      GNK_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci_test_password@localhost:5432/gnkalgo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - name: Verify migrations forward and backward on an empty test database
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Verify immutable project branding
        run: python ../deploy/check_branding.py
      - run: python -m pytest tests -q
      - name: Verify production TLS preflight checks
        run: python -m unittest discover -s ../deploy/tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: curl --fail --retry 5 --retry-delay 5 http://localhost/api/ready
      - if: always()
        run: docker compose logs --tail=80
