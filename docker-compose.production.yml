services:
  api:
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --no-proxy-headers, --no-access-log]
  nginx:
    healthcheck:
      test: [CMD-SHELL, "nginx -t >/dev/null 2>&1 && wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports: ["443:443"]
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-./deploy/tls}:/etc/nginx/tls:ro
      - ${ACME_WEBROOT:-/opt/gnkalgo_AI/certbot/www}:/var/www/certbot:ro
