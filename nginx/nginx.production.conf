limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    server_name gnkalgo.com www.gnkalgo.com localhost;
    server_tokens off;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    location = /api/docs { return 404; }
    location = /api/openapi.json { return 404; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params;
        proxy_pass http://api:8000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params;
        proxy_pass http://api:8000;
    }
    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://web:3000;
    }
}
server {
    listen 443 ssl;
    server_name app.gnkalgo.com;
    ssl_certificate /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://gnkalgo.com$request_uri;
}
server {
    listen 80;
    server_name gnkalgo.com www.gnkalgo.com app.gnkalgo.com;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://gnkalgo.com$request_uri; }
}
